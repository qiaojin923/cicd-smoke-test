name: Bootstrap first version (one-time, token)

# 一次性用途：npm 不允许对尚不存在的包创建 trusted publisher，
# 所以全新包的第一版必须用传统凭证发出来。为了仍在 CI 里完成这一步，
# 这里用临时 granular token，发完立即 revoke 并删除 secret。
# 正常发版请用 publish.yml（纯 OIDC，不需要任何 token）。

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: '版本清单文件名，例如 0.1.0.json'
        required: true
        default: '0.1.0.json'

permissions:
  contents: read

jobs:
  bootstrap:
    name: bootstrap publish (token)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read release manifest
        id: manifest
        run: |
          FILE="releases/${{ inputs.manifest }}"
          test -f "$FILE" || { echo "::error::missing $FILE"; exit 1; }
          node -e '
            const m = require("./" + process.argv[1]);
            const distTag = m.distTag || "latest";
            for (const k of ["name", "version", "url", "sha256"]) {
              if (!m[k]) { console.error(`missing field: ${k}`); process.exit(1); }
            }
            console.log(`name=${m.name}`);
            console.log(`url=${m.url}`);
            console.log(`sha256=${m.sha256}`);
            console.log(`version=${m.version}`);
            console.log(`distTag=${distTag}`);
          ' "$FILE" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/pkg.tgz" \
            "${{ steps.manifest.outputs.url }}"

      - name: Verify sha256
        run: |
          EXPECTED="${{ steps.manifest.outputs.sha256 }}"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/pkg.tgz" | cut -d' ' -f1)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::sha256 mismatch"; exit 1
          fi

      - name: Verify tarball identity
        run: |
          tar -xzOf "$RUNNER_TEMP/pkg.tgz" package/package.json > "$RUNNER_TEMP/manifest.json"
          node -e '
            const fs = require("fs");
            const got = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (got.name !== process.argv[2] || got.version !== process.argv[3]) {
              console.error(`mismatch: ${got.name}@${got.version}`); process.exit(1);
            }
            console.log(`OK ${got.name}@${got.version}`);
          ' "$RUNNER_TEMP/manifest.json" \
            "${{ steps.manifest.outputs.name }}" \
            "${{ steps.manifest.outputs.version }}"

      - name: Check token present
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::缺少 NPM_TOKEN secret —— 需要在仓库 Secrets 里配置一个 granular access token（勾选 bypass 2FA）"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with token
        run: npm publish "$RUNNER_TEMP/pkg.tgz" --access public --tag "${{ steps.manifest.outputs.distTag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
